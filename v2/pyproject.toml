[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u-jepa-v2"
version = "0.0.1"
description = "Probe-gated latent-memory continual learner (U-JEPA v2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kartikshirode" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
nf4 = ["bitsandbytes>=0.43"]
memory = ["faiss-cpu>=1.7.4", "sentence-transformers>=2.7"]
probes = ["datasets>=2.18"]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["u_jepa_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "network: requires HF / dataset download (set U_JEPA_V2_RUN_NETWORK=1 to enable)",
    "cuda: requires a CUDA device",
    "slow: takes more than ~30s",
]
