# MEMIT on Llama-3.2-3B-Instruct.
#
# Derived from EasyEdit's llama3-8b MEMIT template with this model's numbers:
# 28 layers, hidden 3072, intermediate 8192. The critical layer band stays where
# the template put it, which is early-middle and well inside 28 layers.
#
# NOT VALIDATED against an installed EasyEdit. Run
# `python v3/scripts/04_check_hparams.py v3/hparams/` on the cluster first.
#
# Memory: 5 covariances of 8192x8192 fp32, 1.34 GB, on top of 6.4 GB of bf16
# weights. Fits a 1g.18gb slice.
alg_name: "MEMIT"
model_name: "meta-llama/Llama-3.2-3B-Instruct"
stats_dir: "./data/stats"
device: 0
layers: [4, 5, 6, 7, 8]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 27
v_weight_decay: 1e-3
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
model_parallel: false
fp16: false
